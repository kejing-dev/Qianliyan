[versions]
agp = "8.13.2"
kotlin = "2.1.20"
coreKtx = "1.13.0"
spatialBom = "6.1.9"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
annotation = "1.7.0"
appcompat = "1.6.1"
lifecycle = "2.8.7"
coroutines = "1.9.0"
